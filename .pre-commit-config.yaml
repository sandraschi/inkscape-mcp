repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff
        args: [ --fix, --exit-non-zero-on-fix ]
      - id: ruff-format

  - repo: local
    hooks:
      - id: pyright
        name: Type check with pyright (fleet gate)
        # mypy --strict retired 2026-10-03: 467 pre-existing errors, mostly
        # FastMCP-decorator-systemic (every @mcp.tool function is "untyped" to
        # mypy) - it could never pass, blocking ALL Python commits. pyright is
        # the fleet five-gate checker and is green on this repo.
        entry: uv run pyright src/
        language: system
        files: \.py$
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: check-added-large-files
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: forbidden-terms
        name: Forbidden Terms Check
        # NOTE: plain `grep -riE` exits 1 on a CLEAN tree, which pre-commit
        # reports as failure - the `!` inversion makes exit 0 = clean (pass),
        # exit 1 = term found (fail). Requires Git-Bash (present wherever git is).
        entry: bash -c '! grep -riE "INTERNAL-PROJECT|PRIVATE-KEY" "$@"' bash
        language: system
        files: \.(py|toml|rs|md)$
        pass_filenames: true
